<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Archive | For Faraday</title>
    <style>
        body {
            background-color: #fff5f5; 
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            color: #4a4a4a;
        }

        .archive-container {
            text-align: center;
            width: 90%;
            max-width: 500px;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 182, 193, 0.3);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 30px;
            color: #ff4b5c;
        }

        .archive-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .archive-item {
            margin: 15px 0;
            transition: transform 0.2s ease;
        }

        .archive-item:hover {
            transform: translateY(-3px);
        }

        .archive-link {
            display: block;
            padding: 15px;
            text-decoration: none;
            color: #4a4a4a;
            border: 1px solid #ffe0e0;
            border-radius: 12px;
            transition: all 0.3s ease;
            background-color: #fffafb;
        }

        .archive-link:hover {
            background-color: #ff4b5c;
            color: white;
            border-color: #ff4b5c;
        }

        .heart-icon {
            margin-right: 8px;
        }

        .back-home {
            margin-top: 30px;
            display: inline-block;
            font-size: 0.9rem;
            color: #ff4b5c;
            text-decoration: none;
            opacity: 0.7;
        }

        .back-home:hover {
            opacity: 1;
            text-decoration: underline;
        }

        #bear-trail div {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 9999;
            font-size: 24px;
            user-select: none;
        }
    </style>
</head>
<body>
    <div id="bear-trail"></div>
    <div class="archive-container">
    <h1>Your Collection</h1>
    <ul id="archiveList" class="archive-list">
        </ul>
</div>

<script>
    async function loadArchive() {
        try {
            // Fetch the list from the messages folder
            const response = await fetch('messages/list.json');
            if (!response.ok) throw new Error('Could not load list.json');
            
            const messages = await response.json();
            const listElement = document.getElementById('archiveList');

            messages.forEach(msg => {
                const li = document.createElement('li');
                li.className = 'archive-item';
                // Clean link without emojis
                li.innerHTML = `
                    <a href="message.html?msg=${msg.id}" class="archive-link">
                        ${msg.title}
                    </a>
                `;
                listElement.appendChild(li);
            });
        } catch (e) {
            console.error("Archive Error:", e);
        }
    }
    loadArchive();

    const bearContainer = document.getElementById('bear-trail');
    const emojis = ['🧸', '🧸', '🧸', '🧸', '🧸']; 
    const dots = [];
    const mouse = { x: 0, y: 0 };

    // 1. Create the 5 bears
    emojis.forEach((emoji) => {
        const div = document.createElement('div');
        div.innerHTML = emoji;
        bearContainer.appendChild(div);
        dots.push({ x: 0, y: 0, element: div });
    });

    // 2. Track mouse and touch
    const updatePosition = (e) => {
        if (e.touches) {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        } else {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        }
    };

    window.addEventListener('mousemove', updatePosition);
    window.addEventListener('touchmove', updatePosition);

    // 3. The Snake Math
    function animateSnake() {
        let x = mouse.x;
        let y = mouse.y;

        dots.forEach((dot, index) => {
            // "Snake" logic: Each dot follows the coordinates of the one before it
            // We use 0.3 for a "close" follow. 
            // Lower numbers (0.1) = longer, lazier snake. Higher (0.5) = tighter snake.
            dot.x += (x - dot.x) * 0.4; 
            dot.y += (y - dot.y) * 0.4;
            
            dot.element.style.transform = `translate(${dot.x}px, ${dot.y}px)`;

            // For the next bear in the loop, use the current bear's position as the target
            x = dot.x;
            y = dot.y;
        });

        requestAnimationFrame(animateSnake);
    }

    animateSnake();
</script>

</body>
</html>
