<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For my baby</title>
    
    <style>
    body {
        background-color: #fff5f5;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center; /* Horizontal center */
        justify-content: center; /* Vertical center */
        min-height: 100vh;
        font-family: 'Courier New', Courier, monospace;
    }

    .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 90%;
        max-width: 600px;
    }

    #messageButton {
        background-color: #ff4b5c;
        color: white;
        border: none;
        padding: 15px 30px;
        font-size: 1.2rem;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    /* Fade-in Logic */
    #messageDisplay {
        opacity: 0;
        transition: opacity 2s ease-in; /* Smooth 2-second fade */
        margin-top: 20px;
        white-space: pre-wrap;
        text-align: center; /* Centralizes the text itself */
        color: #4a4a4a;
        font-size: 1.1rem;
    }

    #messageDisplay.visible {
        opacity: 1;
    }

    .archive-link {
        margin-top: 40px;
        font-size: 0.8rem;
        color: #ff4b5c;
        text-decoration: none;
        opacity: 0.6;
    }
    </style>

    <div class="container">
        <button id="messageButton" onclick="openMessage()">Open your message</button>
        <div id="messageDisplay"></div>
        <a href="archive.html" class="archive-link">View Archive</a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script>
    async function openMessage() {
        const password = prompt("Enter the secret date (DDMMYYYY):");
        try {
            const response = await fetch('./messages/2026.txt');
            const encryptedBase64 = await response.text();

            // Attempt decryption
            const bytes = CryptoJS.AES.decrypt(encryptedBase64, password);
            const decryptedMessage = bytes.toString(CryptoJS.enc.Utf8);

            // POINT 1: Validate if decryption actually worked
            if (!decryptedMessage || decryptedMessage.length === 0) {
                alert("Incorrect password. Please try again!");
                return;
            }

            // POINT 2 & 3: Hide button and Fade in
            const btn = document.getElementById('messageButton');
            const display = document.getElementById('messageDisplay');
            
            btn.style.display = 'none';
            display.innerHTML = decryptedMessage;
            display.classList.add('visible'); // Triggers the CSS fade

        } catch (e) {
            alert("Incorrect password or error loading file.");
        }
    }
    </script>

</html>
