<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Archive | For Faraday</title>
    <style>
        body {
            background-color: #fff5f5; 
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            color: #4a4a4a;
        }

        .archive-container {
            text-align: center;
            width: 90%;
            max-width: 500px;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 182, 193, 0.3);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 30px;
            color: #ff4b5c;
        }

        .archive-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .archive-item {
            margin: 15px 0;
            transition: transform 0.2s ease;
        }

        .archive-item:hover {
            transform: translateY(-3px);
        }

        .archive-link {
            display: block;
            padding: 15px;
            text-decoration: none;
            color: #4a4a4a;
            border: 1px solid #ffe0e0;
            border-radius: 12px;
            transition: all 0.3s ease;
            background-color: #fffafb;
        }

        .archive-link:hover {
            background-color: #ff4b5c;
            color: white;
            border-color: #ff4b5c;
        }

        .heart-icon {
            margin-right: 8px;
        }

        .back-home {
            margin-top: 30px;
            display: inline-block;
            font-size: 0.9rem;
            color: #ff4b5c;
            text-decoration: none;
            opacity: 0.7;
        }

        .back-home:hover {
            opacity: 1;
            text-decoration: underline;
        }

    </style>
</head>
<body>
    <div id="cursor-bear" style="position: fixed; pointer-events: none; z-index: 9999; font-size: 30px; transition: transform 0.1s ease-out; will-change: transform;">🧸</div>
    <div class="archive-container">
    <h1>Your Collection</h1>
    <ul id="archiveList" class="archive-list">
        </ul>
</div>

<script>
    async function loadArchive() {
        try {
            // Fetch the list from the messages folder
            const response = await fetch('messages/list.json');
            if (!response.ok) throw new Error('Could not load list.json');
            
            const messages = await response.json();
            const listElement = document.getElementById('archiveList');

            messages.forEach(msg => {
                const li = document.createElement('li');
                li.className = 'archive-item';
                // Clean link without emojis
                li.innerHTML = `
                    <a href="message.html?msg=${msg.id}" class="archive-link">
                        ${msg.title}
                    </a>
                `;
                listElement.appendChild(li);
            });
        } catch (e) {
            console.error("Archive Error:", e);
        }
    }
    loadArchive();

    const bear = document.getElementById('cursor-bear');
    let mouseX = 0;
    let mouseY = 0;
    let bearX = 0;
    let bearY = 0;

    // 1. Track the mouse/touch position
    window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
    });

    window.addEventListener('touchmove', (e) => {
        // For phones: take the first finger's position
        mouseX = e.touches[0].clientX;
        mouseY = e.touches[0].clientY;
    });

    // 2. The "Ease" Animation (Makes the bear follow smoothly rather than snapping)
    function animate() {
        // This math creates a "delay" so the bear feels like it's floating/chasing
        // Change 0.1 to a smaller number (like 0.05) to make it slower/lazier
        const speed = 0.08; 
        
        bearX += (mouseX - bearX) * speed;
        bearY += (mouseY - bearY) * speed;

        // Offset the bear slightly so it's not directly under the finger/cursor
        bear.style.transform = `translate(${bearX + 15}px, ${bearY + 15}px)`;

        requestAnimationFrame(animate);
    }

    animate();
</script>

</body>
</html>
