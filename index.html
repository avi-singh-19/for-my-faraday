<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Archive | For Faraday</title>
    <style>
        body {
            background-color: #fff5f5; 
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            color: #4a4a4a;
        }

        .archive-container {
            text-align: center;
            width: 90%;
            max-width: 500px;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 182, 193, 0.3);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 30px;
            color: #ff4b5c;
        }

        .archive-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .archive-item {
            margin: 15px 0;
            transition: transform 0.2s ease;
        }

        .archive-item:hover {
            transform: translateY(-3px);
        }

        .archive-link {
            display: block;
            padding: 15px;
            text-decoration: none;
            color: #4a4a4a;
            border: 1px solid #ffe0e0;
            border-radius: 12px;
            transition: all 0.3s ease;
            background-color: #fffafb;
        }

        .archive-link:hover {
            background-color: #ff4b5c;
            color: white;
            border-color: #ff4b5c;
        }

        .heart-icon {
            margin-right: 8px;
        }

        .back-home {
            margin-top: 30px;
            display: inline-block;
            font-size: 0.9rem;
            color: #ff4b5c;
            text-decoration: none;
            opacity: 0.7;
        }

        .back-home:hover {
            opacity: 1;
            text-decoration: underline;
        }

        /* Floating Elements Style */
        .floating-item {
            position: fixed;
            bottom: -50px; /* Start just off-screen */
            font-size: 2rem;
            user-select: none;
            pointer-events: none; /* So she can click "through" them to the buttons */
            z-index: -1; /* Keep them behind the text and buttons */
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="archive-container">
    <h1>Your Collection</h1>
    <ul id="archiveList" class="archive-list">
        </ul>
</div>

<script>
    async function loadArchive() {
        try {
            // Fetch the list from the messages folder
            const response = await fetch('messages/list.json');
            if (!response.ok) throw new Error('Could not load list.json');
            
            const messages = await response.json();
            const listElement = document.getElementById('archiveList');

            messages.forEach(msg => {
                const li = document.createElement('li');
                li.className = 'archive-item';
                // Clean link without emojis
                li.innerHTML = `
                    <a href="message.html?msg=${msg.id}" class="archive-link">
                        ${msg.title}
                    </a>
                `;
                listElement.appendChild(li);
            });
        } catch (e) {
            console.error("Archive Error:", e);
        }
    }
    loadArchive();

    function createFloatingIcons() {
    const icons = ['❤️', '🧸', '💖', '🧸', '✨']; 
    const container = document.body;

    setInterval(() => {
        const icon = document.createElement('div');
        icon.className = 'floating-item';
        icon.innerText = icons[Math.floor(Math.random() * icons.length)];
        
        // Randomize position and speed
        const startX = Math.random() * window.innerWidth;
        const duration = 10 + Math.random() * 15; // Between 10 and 25 seconds
        const size = 1 + Math.random() * 1.5; // Random sizes

        icon.style.left = `${startX}px`;
        icon.style.animationDuration = `${duration}s`;
        icon.style.fontSize = `${size}rem`;

        container.appendChild(icon);

        // Clean up: remove the icon after it finishes floating
        setTimeout(() => {
            icon.remove();
        }, duration * 1000);
    }, 2000); // Create a new icon every 2 seconds
    }

    // Start the floating magic!
    createFloatingIcons();
</script>

</body>
</html>
