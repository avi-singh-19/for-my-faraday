<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For my baby</title>
    <style>
        :root {
            --bg-color: #fff5f5;
            --text-color: #d63384;
            --heart-color: rgba(214, 51, 132, 0.2);
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
        }

        .container {
            z-index: 2;
            padding: 20px;
        }

        h1 {
            color: var(--text-color);
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        #message {
            font-size: 1.2rem;
            color: #555;
            line-height: 1.6;
            max-width: 500px;
            min-height: 100px;
        }

        /* Floating Heart Background */
        .heart {
            position: absolute;
            color: var(--heart-color);
            font-size: 20px;
            user-select: none;
            animation: float 10s linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>For my Faraday Bear</h1>
        <div id="message"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <script>
    async function openValentine() {
        const password = prompt("Enter the secret date (DDMMYYYY):");
        const year = "2026"; // This matches your filename 2026.txt

        try {
            // 1. Fetch the encrypted file from your /messages folder
            const response = await fetch(`./messages/${year}.txt`);
            
            if (!response.ok) throw new Error("Message file not found.");
            
            const encryptedBase64 = await response.text();

            // 2. Decrypt the content
            const bytes = CryptoJS.AES.decrypt(encryptedBase64, password);
            const decryptedMessage = bytes.toString(CryptoJS.enc.Utf8);

            if (!decryptedMessage) {
                alert("Incorrect password. Hint: The day we first met!");
                return;
            }

            // 3. Hide the button and start the typewriter
            document.getElementById('valentineButton').style.display = 'none';
            startTypewriter(decryptedMessage);

        } catch (error) {
            console.error(error);
            alert("Oops! Something went wrong loading the message.");
        }
    }

    function startTypewriter(text) {
        const display = document.getElementById('messageDisplay');
        let i = 0;
        // Speed in milliseconds
        const speed = 50; 

        function type() {
            if (i < text.length) {
                display.innerHTML += text.charAt(i);
                i++;
                setTimeout(type, speed);
                // Scroll to bottom as it types
                window.scrollTo(0, document.body.scrollHeight);
            }
        }
        type();
    }
    </script>
</body>
</html>
