<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Message For You</title>
    <style>
        :root {
            --bg-color: #fff5f5;
            --text-color: #d63384;
            --heart-color: rgba(214, 51, 132, 0.2);
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
        }

        .container {
            z-index: 2;
            padding: 20px;
        }

        h1 {
            color: var(--text-color);
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        #message {
            font-size: 1.2rem;
            color: #555;
            line-height: 1.6;
            max-width: 500px;
            min-height: 100px;
        }

        /* Floating Heart Background */
        .heart {
            position: absolute;
            color: var(--heart-color);
            font-size: 20px;
            user-select: none;
            animation: float 10s linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>To My Favorite Human ❤️</h1>
        <div id="message"></div>
    </div>

    <script>
        const messageText = "I wanted to write you something special... Being a dev, I thought I'd use the one language I know best to tell you how much I love you. Happy Valentine's Day!";
        let i = 0;

        function typeWriter() {
            if (i < messageText.length) {
                document.getElementById("message").innerHTML += messageText.charAt(i);
                i++;
                setTimeout(typeWriter, 50);
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 5 + 5 + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 10000);
        }

        setInterval(createHeart, 300);
        window.onload = typeWriter;
    </script>
</body>
</html>
