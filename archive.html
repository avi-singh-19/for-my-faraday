<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Archive | For Faraday</title>
    <style>
        body {
            background-color: #fff5f5; 
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            color: #4a4a4a;
        }

        .archive-container {
            text-align: center;
            width: 90%;
            max-width: 500px;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 182, 193, 0.3);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 30px;
            color: #ff4b5c;
        }

        .archive-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .archive-item {
            margin: 15px 0;
            transition: transform 0.2s ease;
        }

        .archive-item:hover {
            transform: translateY(-3px);
        }

        .archive-link {
            display: block;
            padding: 15px;
            text-decoration: none;
            color: #4a4a4a;
            border: 1px solid #ffe0e0;
            border-radius: 12px;
            transition: all 0.3s ease;
            background-color: #fffafb;
        }

        .archive-link:hover {
            background-color: #ff4b5c;
            color: white;
            border-color: #ff4b5c;
        }

        .heart-icon {
            margin-right: 8px;
        }

        .back-home {
            margin-top: 30px;
            display: inline-block;
            font-size: 0.9rem;
            color: #ff4b5c;
            text-decoration: none;
            opacity: 0.7;
        }

        .back-home:hover {
            opacity: 1;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="archive-container">
        <h1>Our Collection</h1>
        
        <ul class="archive-list">
            <li class="archive-item">
                <a href="index.html" class="archive-link">
                    Valentine's Day 2026
                </a>
            </li>
            
            <li class="archive-item">
                <a href="ten-things.html" class="archive-link">
                    10 Things I miss about you when you're gone
                </a>
            </li>
            
            </ul>

        <a href="index.html" class="back-home">← Back to latest</a>
    </div>

</body>
</html>
